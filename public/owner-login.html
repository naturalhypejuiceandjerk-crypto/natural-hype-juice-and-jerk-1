<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owner Login | Natural Hype Juice and Jerk</title>
    <meta name="description" content="Owner login for Natural Hype Juice and Jerk." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=Pacifico&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Natural Hype Juice and Jerk home">
          <img src="/assets/logo.png" alt="Natural Hype logo" class="brand-logo" />
          <div>
            <strong>Natural Hype</strong>
            <span>Business login</span>
          </div>
        </a>
      </header>

      <main>
        <section class="ticket-section">
          <div class="ticket-panel">
            <p class="eyebrow">Owner only</p>
            <h1>Business login</h1>
            <p class="ticket-copy">Enter the business password to open the private owner orders page.</p>
            <form class="owner-login" id="ownerLogin">
              <label>
                <span>Business password</span>
                <input id="adminPin" name="adminPin" type="password" inputmode="numeric" autocomplete="current-password" required />
              </label>
              <button class="button primary" type="submit">Open owner orders</button>
            </form>
            <p class="form-message" id="ownerMessage" aria-live="polite"></p>
          </div>
        </section>
      </main>
    </div>

    <script>
      const ownerLogin = document.getElementById("ownerLogin");
      const adminPin = document.getElementById("adminPin");
      const ownerMessage = document.getElementById("ownerMessage");

      function setOwnerMessage(message, isError = false) {
        ownerMessage.textContent = message;
        ownerMessage.style.color = isError ? "#b42318" : "var(--green)";
      }

      ownerLogin.addEventListener("submit", async (event) => {
        event.preventDefault();
        setOwnerMessage("Checking PIN...");
        try {
          const response = await fetch("/api/admin/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              pin: adminPin.value.trim()
            })
          });
          const data = await response.json();

          if (!response.ok || !data.ok) {
            throw new Error(data.error || "Owner PIN is incorrect.");
          }

          window.location.href = "/owner.html";
        } catch (error) {
          setOwnerMessage(error.message || "Owner login failed.", true);
        }
      });
    </script>
  </body>
</html>
