<!DOCTYPE html>
<html lang="en">
  <head>
    <meta content="text/html; charset=UTF-8" http-equiv="content-type">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Ticket | Natural Hype Juice and Jerk</title>
    <meta name="description" content="Natural Hype Juice and Jerk order confirmation ticket.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&amp;family=Pacifico&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="site-shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Natural Hype Juice and Jerk home">
          <img src="/assets/logo.png" alt="Natural Hype logo" class="brand-logo">
          <div>
            <strong>Natural Hype</strong>
            <span>Juice and Jerk</span>
          </div>
        </a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/order.html">Order</a>
          <a href="/checkout.html">Checkout</a>
        </nav>
      </header>

      <main>
        <section class="ticket-section">
          <div class="ticket-panel">
            <p class="eyebrow">Order received</p>
            <h1>Thanks, <span id="ticketName">customer</span></h1>

            <div class="order-ticket" aria-label="Order ticket">
              <span>Order ticket</span>
              <strong id="ticketNumber">NH-ORDER</strong>
            </div>

            <div class="ticket-items">
              <div class="ticket-items-header">
                <span>Food purchased</span>
                <strong id="ticketTotal">GBP 0.00</strong>
              </div>
              <ul id="ticketItems"></ul>
            </div>

            <div class="ticket-details">
              <div>
                <span>Payment</span>
                <strong id="ticketPayment">Card online</strong>
              </div>
            </div>

            <div class="ticket-actions">
              <a class="button primary" href="/order.html">Start another order</a>
              <a class="button secondary" href="/">Back home</a>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script>
      const params = new URLSearchParams(window.location.search);
      let savedOrder = {};

      try {
        savedOrder = JSON.parse(window.sessionStorage.getItem("naturalHypeLastOrder") || "{}");
      } catch (error) {
        savedOrder = {};
      }

      if (window.location.hash.startsWith("#receipt=")) {
        try {
          savedOrder = JSON.parse(decodeURIComponent(window.location.hash.slice(9)));
        } catch (error) {
          savedOrder = {};
        }
      }

      const orderId = params.get("order") || savedOrder.orderId || "NH-ORDER";
      const customerName = params.get("name") || savedOrder.name || "customer";
      const paymentMethod = params.get("payment") || savedOrder.payment || "card";
      const paymentLabels = {
        card: "Card online",
        cash: "Cash on collection"
      };
      const currencyFormatter = new Intl.NumberFormat("en-GB", {
        style: "currency",
        currency: "GBP"
      });

      function cleanText(value) {
        return String(value || "").replace(/[<>]/g, "").trim();
      }

      function itemLabel(item) {
        return [item.name, item.optionLabel, item.rice].filter(Boolean).map(cleanText).join(" - ");
      }

      document.getElementById("ticketNumber").textContent = orderId;
      document.getElementById("ticketName").textContent = customerName;
      document.getElementById("ticketPayment").textContent = paymentLabels[paymentMethod] || "Card online";

      const ticketItems = document.getElementById("ticketItems");
      const items = Array.isArray(savedOrder.items) ? savedOrder.items : [];
      const total = Number(savedOrder.total || 0);

      document.getElementById("ticketTotal").textContent = currencyFormatter.format(total);
      ticketItems.innerHTML = items.length
        ? items
            .map((item) => {
              const quantity = Number(item.quantity || 1);
              const lineTotal = Number(item.lineTotal || 0);
              return `
                <li>
                  <div>
                    <strong>${quantity} x ${itemLabel(item)}</strong>
                    <span>${currencyFormatter.format(lineTotal)}</span>
                  </div>
                </li>
              `;
            })
            .join("")
        : "<li><div><strong>Your food order is confirmed.</strong><span>Total shown above</span></div></li>";
    </script>
  </body>
</html>
